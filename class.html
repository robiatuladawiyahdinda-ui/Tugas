<!-- Mendeklarasikan bahwa dokumen ini menggunakan standar HTML5 -->
<!DOCTYPE html>

<!-- Tag pembuka untuk seluruh elemen yang ada di dalam dokumen HTML -->
<html>

<!-- Bagian head berisi informasi meta dan pengaturan dokumen yang tidak ditampilkan secara langsung di halaman web -->
<head>
  <!-- Menentukan karakter encoding UTF-8 agar browser dapat membaca berbagai jenis teks, karakter, dan simbol dengan benar -->
  <meta charset="utf-8">
  
  <!-- Mengatur viewport agar tampilan web responsif, lebarnya akan menyesuaikan dengan layar perangkat pengguna (misalnya HP atau Laptop) -->
  <meta name="viewport" content="width=device-width">
  
  <!-- Menentukan judul halaman menjadi "Class" yang akan tampil pada tab browser pengguna -->
  <title>Class</title>
  
  <!-- Menghubungkan file HTML ini dengan file CSS eksternal (style.css) untuk memberikan gaya dan desain pada halaman -->
  <link href="style.css" rel="stylesheet" type="text/css" />
</head> <!-- Penutup bagian head -->

<!-- Bagian body berisi elemen-elemen yang akan terlihat langsung oleh pengguna di halaman web -->
<body>
  
  <!-- Membuat elemen paragraf kosong dengan atribut ID "demo". ID ini akan dijadikan target oleh file JavaScript untuk menampilkan hasil output -->
  <p id="demo"></p>
  
  <!-- Menghubungkan dan menjalankan file JavaScript eksternal yang bernama "class.js". Di sinilah logika pemrograman Class (OOP) Anda berada -->
  <script src="class.js"></script>

  <!-- 
  Komentar bawaan dari Replit:
  Script di bawah ini berfungsi untuk menempatkan lencana (badge) pada tampilan browser penuh dari repl Anda.
  -->
  
  <!-- Memuat script JavaScript dari Replit untuk menampilkan lencana biru di pojok halaman. Atribut 'defer' membuat script ini dimuat paling akhir agar tidak mengganggu proses muat halaman utama -->
  <script src="https://replit.com/public/js/replit-badge.js" theme="blue" defer></script>
  
</body> <!-- Penutup bagian body -->

</html> <!-- Penutup seluruh dokumen HTML -->
