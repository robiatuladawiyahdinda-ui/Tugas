<!-- Mendeklarasikan bahwa dokumen ini menggunakan standar HTML5 -->
<!DOCTYPE html>

<!-- Tag pembuka untuk elemen utama/root dari seluruh halaman HTML -->
<html>

<!-- Bagian head berisi informasi meta (data tentang data) dari dokumen HTML yang tidak ditampilkan secara langsung di halaman -->
<head>
  <!-- Menentukan karakter encoding UTF-8 agar browser mengenali hampir semua karakter, teks, dan simbol -->
  <meta charset="utf-8">
  
  <!-- Mengatur viewport agar tampilan web responsif (skala dan lebarnya menyesuaikan ukuran layar perangkat pengguna) -->
  <meta name="viewport" content="width=device-width">
  
  <!-- Menentukan judul halaman web yang akan muncul di tab browser pengguna -->
  <title>Array</title>
  
  <!-- Menghubungkan dokumen HTML ini dengan file CSS eksternal (style.css) untuk mengatur desain atau tampilan -->
  <link href="style.css" rel="stylesheet" type="text/css" />
</head> <!-- Penutup bagian head -->

<!-- Bagian body berisi konten yang akan dirender dan ditampilkan secara visual di halaman web -->
<body>
  
  <!-- Membuat elemen paragraf kosong dengan atribut penanda ID "demo". ID ini biasanya akan ditargetkan oleh JavaScript (di array.js) untuk menyisipkan hasil atau output teks ke halaman web -->
  <p id="demo"></p>
  
  <!-- Menghubungkan dan menjalankan file JavaScript eksternal bernama "array.js". Di sinilah logika pemrograman array Anda berada -->
  <script src="array.js"></script>

  <!-- 
  Komentar bawaan dari Replit:
  Script di bawah ini berfungsi untuk menempatkan lencana (badge) pada tampilan browser penuh dari repl Anda,
  yang jika diklik akan mengarahkan kembali ke halaman sampul repl Anda.
  Anda bisa mencoba berbagai warna untuk temanya: dark, light, red, orange, yellow, lime, green, teal, blue, blurple, magenta, pink!
  -->
  
  <!-- Memuat script JavaScript eksternal khusus dari Replit untuk menampilkan lencana biru. Atribut 'defer' memastikan script ini hanya berjalan setelah seluruh elemen HTML selesai dimuat -->
  <script src="https://replit.com/public/js/replit-badge.js" theme="blue" defer></script>
  
</body> <!-- Penutup bagian body -->

</html> <!-- Penutup seluruh dokumen HTML -->
