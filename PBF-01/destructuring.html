<!DOCTYPE html>
<!-- Mendeklarasikan kepada browser bahwa dokumen ini menggunakan standar HTML5 -->
<html>

<head>
  <!-- Bagian 'head' berisi informasi teknis (metadata) tentang halaman web ini yang tidak ditampilkan langsung di layar -->
  <meta charset="utf-8">
  <!-- Menentukan format karakter standar (UTF-8) agar browser bisa membaca berbagai macam huruf dan simbol dengan benar -->
  <meta name="viewport" content="width=device-width">
  <!-- Membuat tampilan halaman web responsif (menyesuaikan secara otomatis dengan lebar layar perangkat seperti HP atau laptop) -->
  <title>Destructuring</title>
  <!-- Menentukan judul halaman web yang akan muncul pada bagian tab di browser Anda -->
  <link href="style.css" rel="stylesheet" type="text/css" />
  <!-- Menghubungkan file eksternal 'style.css' yang berfungsi untuk mengatur desain atau warna tampilan halaman -->
</head>

<body>
  <!-- Bagian 'body' berisi semua elemen atau konten yang akan benar-benar terlihat oleh user di halaman web -->
  <p id="demo"></p>
  <!-- Membuat sebuah paragraf kosong yang diberi tanda pengenal (ID) 'demo'. Biasanya JS akan mencari ID ini untuk memasukkan teks hasil atau output ke layar -->
  
  <script src="destructuring.js"></script>
  <!-- Memanggil dan mengeksekusi file JavaScript eksternal yang bernama 'destructuring.js' di dalam halaman ini -->

  <!--
  This script places a badge on your repl's full-browser view back to your repl's cover
  page. Try various colors for the theme: dark, light, red, orange, yellow, lime, green,
  teal, blue, blurple, magenta, pink!
  -->
  <!-- Ini adalah komentar bawaan dari template Replit yang menjelaskan script badge di bawahnya -->
  <script src="https://replit.com/public/js/replit-badge.js" theme="blue" defer></script>
  <!-- Script khusus dari Replit untuk memunculkan logo/tombol kecil Replit (badge) di pojok halaman web Anda -->
</body>

</html>
<!-- Tag penutup yang menandakan akhir dari keseluruhan dokumen HTML -->
